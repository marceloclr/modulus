<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 105 320 420" role="img" aria-label="Modulus · sistema">
  <title>Modulus · sistema</title>
  <defs><filter id="mdSombra" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity=".12"/></filter></defs>
  <g filter="url(#mdSombra)">
<defs>
    <linearGradient id="mdBlueL" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E88E5"/><stop offset="100%" stop-color="#0066B2"/></linearGradient>
    <linearGradient id="mdBlueD" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0066B2"/><stop offset="100%" stop-color="#003366"/></linearGradient>
    <linearGradient id="mdOrangeR" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF7A00"/><stop offset="100%" stop-color="#E64A19"/></linearGradient>
    <linearGradient id="mdOrangeD" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E65100"/><stop offset="100%" stop-color="#BF360C"/></linearGradient>
    <linearGradient id="mdLeafL" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00897B"/><stop offset="100%" stop-color="#26A69A"/></linearGradient>
    <linearGradient id="mdLeafR" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4CAF50"/><stop offset="100%" stop-color="#8BC34A"/></linearGradient>
  </defs>
  <!-- folhas: verde-azulado à esquerda, verde à direita -->
  <path d="M370,250C370,180 400,140 400,140C400,140 400,210 370,250Z" fill="url(#mdLeafL)"/>
  <path d="M350,210C350,160 385,130 385,130C385,130 380,180 350,210Z" fill="url(#mdLeafL)" opacity=".85"/>
  <path d="M430,250C430,180 400,140 400,140C400,140 400,210 430,250Z" fill="url(#mdLeafR)"/>
  <path d="M450,210C450,160 415,130 415,130C415,130 420,180 450,210Z" fill="url(#mdLeafR)" opacity=".85"/>
  <!-- M modular: módulos azuis à esquerda, laranja à direita -->
  <polygon points="260,200 310,170 310,320 260,350" fill="url(#mdBlueL)"/>
  <polygon points="260,200 260,350 310,380 310,230" fill="url(#mdBlueD)" opacity=".9"/>
  <polygon points="310,230 400,290 400,340 310,280" fill="url(#mdBlueL)"/>
  <polygon points="310,280 400,340 400,370 310,310" fill="url(#mdBlueD)"/>
  <polygon points="400,290 490,230 490,280 400,340" fill="url(#mdOrangeR)"/>
  <polygon points="400,340 490,280 490,310 400,370" fill="url(#mdOrangeD)"/>
  <polygon points="490,170 540,200 540,350 490,320" fill="url(#mdOrangeR)"/>
  <polygon points="490,230 540,200 540,350 490,380" fill="url(#mdOrangeD)" opacity=".9"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="2" fill="#1E2430">Modulus</text>
  <text x="405" y="510" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="10" fill="#5C6B73">SISTEMA</text>
</svg>
