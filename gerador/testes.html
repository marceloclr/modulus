<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Testes do gerador · Modulus</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/base.js"></script></head>
<body><main class="page"><h1 style="font-size:28px">Testes do motor</h1><p id="res">Rodando…</p><div class="tbl-wrap"><table id="t"></table></div></main>
<script src="motor.js"></script><script src="testes.js"></script>
<script>
const {out, falhas} = TestesMotor();
document.getElementById('res').textContent = falhas ? falhas + ' caso(s) com falha' : 'Todos os casos passaram';
document.getElementById('res').dataset.falhas = falhas;
document.getElementById('t').innerHTML = '<thead><tr><th>Caso</th><th>Resultado</th><th>Melhor variante</th></tr></thead><tbody>' +
  out.map(t => `<tr><td>${t.nome}</td><td>${t.ok ? 'ok' : 'falha<br><small>' + t.erros.join('<br>') + '</small>'}</td><td>${t.resumo}</td></tr>`).join('') + '</tbody>';
</script></body></html>
